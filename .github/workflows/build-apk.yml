name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR_VERSION" ] || [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher for AGP 9.1.1 and Gradle 9.3.1. Detected: $JAVA_MAJOR_VERSION"
            exit 1
          fi
          echo "Active Java major version is $JAVA_MAJOR_VERSION (validated for toolchain compatibility)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1)
            if [ -n "$SDK_MGR" ]; then
              yes | "$SDK_MGR" --licenses || true
            fi
          fi

      - name: Configure Release Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "Keystore successfully prepared at $RUNNER_TEMP/my-upload-key.jks"
          elif [ -f "./my-upload-key.jks" ]; then
            echo "Found release keystore at repository root: ./my-upload-key.jks"
          else
            echo "INFO: No release keystore secret (RELEASE_KEYSTORE_BASE64 or KEYSTORE_BASE64) detected and ./my-upload-key.jks is not present."
            echo "If signing credentials are not configured via repository secrets, the Gradle release signing validation task will report the missing keystore."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Release APK
        run: |
          TARGET_APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$TARGET_APK" ]; then
            echo "Release APK successfully verified at: $TARGET_APK"
            ls -lh "$TARGET_APK"
            if [ -n "$ANDROID_HOME" ]; then
              APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
                echo "Checking APK signing status with $APKSIGNER:"
                "$APKSIGNER" verify --verbose "$TARGET_APK" || true
              fi
            fi
          else
            echo "Error: Release APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APK paths:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
